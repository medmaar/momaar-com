<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="shortcut icon" href="/favicon.ico">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Momaar</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.logo{width:120px;height:120px;margin-bottom:56px;border-radius:50%;box-shadow:0 0 0 1px #21262d,0 20px 60px -20px rgba(233,30,140,.45)}
.buttons{display:flex;flex-direction:column;gap:14px;width:100%;max-width:340px}
.btn{display:flex;align-items:center;justify-content:center;background:#161b22;border:1px solid #30363d;border-radius:14px;padding:18px 22px;text-decoration:none;color:#e6edf3;font-size:16px;font-weight:700;letter-spacing:.2px;transition:border-color .15s,transform .1s}
.btn:hover{border-color:#e91e8c;transform:translateY(-1px)}
.btn:active{transform:scale(0.99)}
</style>
</head>
<body>
<img class="logo" src="/favicon.png" alt="Momaar">
<div class="buttons">
  <a class="btn" href="/trial">Logins</a>
  <a class="btn" href="/followup">Follow-up</a>
</div>
</body>
</html>
