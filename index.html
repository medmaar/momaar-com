<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="shortcut icon" href="/favicon.ico">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Momaar</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px}
.logo{width:64px;height:64px;border-radius:50%;margin-bottom:12px}
h1{font-size:20px;font-weight:700;letter-spacing:-.2px;margin-bottom:28px}
.links{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:360px}
.link{display:flex;flex-direction:column;align-items:center;gap:6px;background:#161b22;border:1px solid #21262d;border-radius:12px;padding:18px 10px;text-decoration:none;color:#e6edf3;font-size:14px;font-weight:600;transition:border-color .15s}
.link:hover{border-color:#e91e8c}
.link span{font-size:22px}
.link.wide{grid-column:1/-1;flex-direction:row;justify-content:center}
</style>
</head>
<body>
<img class="logo" src="/favicon.png" alt="">
<h1>Momaar</h1>
<nav class="links">
  <a class="link" href="/trial"><span>🔑</span>Logins</a>
  <a class="link" href="/followup"><span>💬</span>Follow-up</a>
  <a class="link" href="/whatsapp"><span>📱</span>WhatsApp</a>
  <a class="link" href="/panel"><span>📊</span>Panel</a>
  <a class="link wide" href="/generate"><span>⚡</span>Generate</a>
</nav>
</body>
</html>
