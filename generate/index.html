<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="shortcut icon" href="/favicon.ico">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generate</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
.page-header{background:linear-gradient(160deg,#160a24 0%,#161b22 100%);border-top:3px solid #a855f7;overflow:hidden}
.ph-identity{display:flex;align-items:center;gap:14px;padding:20px 20px 16px}
.ph-icon{width:50px;height:50px;background:linear-gradient(135deg,#2a0d40 0%,#a855f7 100%);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 4px 22px rgba(168,85,247,.35);flex-shrink:0}
.ph-text{flex:1}
.ph-title{font-size:22px;font-weight:800;letter-spacing:-.4px;color:#f0f6fc;line-height:1.1}
.ph-sub{font-size:12px;color:#8b949e;margin-top:4px}
.page-nav{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;padding:10px 12px;border-top:1px solid #21262d}
.pnav-btn{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;padding:7px 14px;font-size:12.5px;font-weight:600;color:#8b949e;text-decoration:none;white-space:nowrap;border:1px solid transparent;border-radius:999px;transition:all .18s}
.pnav-btn:hover{color:#e6edf3;background:rgba(255,255,255,.03)}
.pnav-btn.active{color:#a855f7;border-color:#a855f7;background:rgba(168,85,247,.06)}
@media(max-width:480px){.page-nav{gap:4px;padding:8px}.pnav-btn{padding:6px 9px;font-size:12px;gap:4px}}
.container{max-width:580px;margin:0 auto;padding:24px 16px}
.card{background:#161b22;border:1px solid #21262d;border-radius:14px;padding:32px 24px;text-align:center;color:#8b949e;font-size:14px}
</style>
</head>
<body>
<div class="page-header">
  <div class="ph-identity">
    <div class="ph-icon">⚡</div>
    <div class="ph-text">
      <div class="ph-title">Generate</div>
      <div class="ph-sub">Coming soon</div>
    </div>
  </div>
  <nav class="page-nav">
    <a class="pnav-btn" href="/trial">🔑 Logins</a>
    <a class="pnav-btn" href="/followup">💬 Follow-up</a>
    <a class="pnav-btn" href="/whatsapp">📱 WhatsApp</a>
    <a class="pnav-btn" href="/panel">📊 Panel</a>
    <a class="pnav-btn active" href="/generate">⚡ Generate</a>
  </nav>
</div>
<div class="container">
  <div class="card">This page is ready for the Generate tool.</div>
</div>
</body>
</html>
